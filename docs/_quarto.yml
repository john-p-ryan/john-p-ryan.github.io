  output-dir: .

website:
  title: "John P. Ryan"
  description: "John P. Ryan — Economics PhD student at the University of Wisconsin–Madison. Public finance, computational methods, and macroeconomics."
  favicon: files/favicon.svg
  open-graph: true
  navbar:
    pinned: false
    search: false
    left:
      - text: Home
        href: index.qmd
      - text: Research
        href: research.qmd
      - text: Teaching
        href: teaching.qmd
